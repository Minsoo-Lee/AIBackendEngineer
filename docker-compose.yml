services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-pgvector
    environment:
      POSTGRES_DB: springai
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  ragpipeline:
    build: .
    container_name: ragpipeline
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

  aiagent:
    build: ../aiAgent
    container_name: aiagent
    ports:
      - "8081:8081"
    env_file:
      - ../aiAgent/.env
    environment:
      DB_HOST: postgres
    depends_on:
      - postgres
      - ragpipeline

volumes:
  pgdata: